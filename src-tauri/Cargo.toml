[package]
name = "form-studio"
version = "0.4.0"
edition = "2021"
description = "Local 3D tattoo composition workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
