[package]
authors = ["Devauntae Norman"]
name = "form-studio"
version = "0.23.0"
edition = "2021"
description = "Corpora Studio — local body, garment and ink design"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
