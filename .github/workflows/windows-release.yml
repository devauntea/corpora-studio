name: Signed Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-build:
    runs-on: windows-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: python scripts/dependency-notices.py --target x86_64-pc-windows-msvc
      - name: Import signing certificate and package
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Signing credentials are not configured.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'form-studio-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
            $env:WINDOWS_CERTIFICATE_THUMBPRINT = $certificate.Thumbprint
            node scripts/signing-preflight.mjs win32
            if ($LASTEXITCODE -ne 0) { throw 'Signing preflight failed.' }
            node scripts/windows-release.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
          } finally {
            if (Test-Path $certificatePath) { Remove-Item $certificatePath }
            if ($certificate) { Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" }
          }
      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if (!$artifacts.Count) { throw 'No installer was built.' }
          foreach ($artifact in $artifacts) {
            if ((Get-AuthenticodeSignature $artifact.FullName).Status -ne 'Valid') { throw 'Installer signature is not valid.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-release
          path: src-tauri/target/release/bundle/
